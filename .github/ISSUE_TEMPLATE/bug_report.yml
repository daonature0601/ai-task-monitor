name: Bug 报告
description: 报告一个可复现的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息 —— 尤其是**采集类问题**，没有数据样本很难定位。
        提交前请确认 `.gitignore` 中的本地数据不会被误传（不要粘贴完整日志或数据库文件）。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 应用版本（设置页或菜单栏可见）或 commit hash
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 10/11
        - Linux
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 相关工具
      multiple: true
      options:
        - Codex
        - Claude Code
        - DeepSeek Harness
        - CodeBuddy
        - WorkBuddy
        - Cursor
        - 元宝
        - 与具体工具无关（界面 / 统计）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 例如：概览的「运行中任务」应与实时任务卡片数量一致
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 例如：卡片显示 3 个任务，指标卡显示 1 个
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 Codex 并发送一条消息
        2. 等待 30 秒
        3. 观察概览页
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图（可选）
      description: 自检输出 `npm run smoke` 很有帮助；请先脱敏路径与用户名
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 已搜索过现有 issue，确认不是重复问题
          required: true
        - label: 内容中不包含 access token、cookie 或完整的私有日志
          required: true
